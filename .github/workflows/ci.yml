name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: package.json and .meta files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node "Tools~/check-package.mjs"

  tests:
    name: Edit mode tests on .NET (no Unity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      # PackageShipsTheIosFramework needs the iOS binary from Tools~/fetch-ios-sdk.sh, which is not in Git.
      - run: dotnet test "Tests~/DotNet" --filter "Name!=PackageShipsTheIosFramework"
