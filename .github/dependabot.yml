version: 2
updates:
  - package-ecosystem: nuget
    directory: /Tests~/DotNet
    schedule:
      interval: monthly
    ignore:
      - dependency-name: NUnit
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
